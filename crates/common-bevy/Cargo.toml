[package]
name = "common-bevy"
version = "0.1.0"
edition = "2021"

# Bevy's dynamic_linking speeds up iteration builds and cannot be linked under
# the release profile's LTO: the dylib carries no bitcode, so every static it
# owns comes out undefined. Off here, switched on by the binaries that want it.
[features]
default = []
dynamic = ["bevy/dynamic_linking"]

[dependencies]
common = { path = "../common" }
bevy = "0.18"
bevy_camera = "0.18"
bevy_mesh = "0.18"
dashmap = "6"
lru = "0"
rand = "0.9"
rstar = "0"
serde = { version = "1", features = ["derive"] }
tinyvec = { version = "1", features = ["serde"] }

[dependencies.qrz]
path = "../qrz"

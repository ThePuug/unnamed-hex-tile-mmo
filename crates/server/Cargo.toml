[package]
name = "server"
version = "0.1.0"
edition = "2021"

[features]
default = ["dynamic"]
# Bevy links as a dylib so an edit rebuilds this crate instead of the engine.
# Incompatible with the release profile's LTO, which needs bitcode the dylib
# does not carry — drop it with `--no-default-features` for an optimized build.
dynamic = ["bevy/dynamic_linking", "common-bevy/dynamic"]
trace = ["bevy/trace", "bevy/trace_tracy", "bevy/debug"]

[dependencies]
common = { path = "../common" }
common-bevy = { path = "../common-bevy" }
bevy = "0.18"
bevy_easings = "0.18"
renet_netcode = "2"
bimap = "0"
bincode = { version = "2", default-features = false, features = ["std", "serde"] }
chrono = "0"
pathfinding = "4"
rand = "0.9"
renet = "2"
serde = { version = "1", features = ["derive"] }
tinyvec = { version = "1", features = ["serde"] }

[dependencies.qrz]
path = "../qrz"

[dependencies.world]
path = "../world"

# What `arena tune` searches, within what bounds, what every scenario holds
# fixed, and how a matrix is scored (`tune.rs`). Read as a command starts.

# Fights per pairing in a search's evaluation, and in the longer look that
# decides whether a search keeps what it found; how many times CMA-ES's own
# count of candidates each generation holds, its fights shared (`tune.rs`);
# and the skill tier the NPCs fight at
runs = 10
check_runs = 40
population = 2.0
skill = "sharp"

# Held in every scenario: endurance has no effect for now, in the fights or
# in the minds
[fixed]
endurance_cost = 0.0
reaction_effort = 0.0
reaction_per_threat = 0.0
off_arc_cost = 0.0
fatigue_recovery = 0.0
fatigue_window = 0.0
fatigue_stamina = 0.0

# Balance lessens each pairing's edge and its fights run to the cap, each a
# hundred points off fair, both at `edge` a point, and what its median
# fight falls short of `short` seconds; it keeps nothing that widens a
# pairing's win split past `band` points either side of even. A mind
# raises its archetype's edge, each fight run to the cap a loss at full
# health
[score]
band = 15.0
edge = 1.0
short = 24.0

# A mind is held to its archetype's style: the commitment its build invests
# in, used at least `floor`. In points: Ferocity's early combos of its
# skills (at most three in four), Grit's bind uptime on its foe (about half
# for a fighter playing to bind), Grace's strikes across its line of its
# strikes (at most two in three), Preparation's early reactions of its
# reactions (at most all), Patience's refilling at its faster rate of all
# its refilling (about half); Awareness's damage answered per clear in
# threats' worth (about two one on one). Each floor is three quarters of
# what the style reaches. Below it
# the mind's score loses `weight` of a hundred points for each share of the
# floor it falls short of. An archetype with no floor is held to nothing.
[style]
weight = 0.25

[style.floor]
berserker = 56.25
juggernaut = 25.0
kiter = 50.0
defender = 1.5
skirmisher = 37.5
ambusher = 75.0

[screen]
# A knob whose sweep across its bounds moves no pairing's edge by this many
# points is left out of the balance search
min_moved = 3.0

# The game's numbers searched, each within its bounds. The bounds hold the
# authored hard constraints: Grit share at least 0.1, Counter's recovery
# over 0.5s, Parry's at least 1s. A number that sets how far a style can

# What `arena tune` searches, within what bounds, what every scenario holds
# fixed, and how a matrix is scored (`tune.rs`). Read as a command starts.

# Fights per pairing in a search's evaluation, and in the longer look that
# decides whether a search keeps what it found; how many times CMA-ES's own
# count of candidates each generation holds, its fights shared (`tune.rs`);
# and the skill tier the NPCs fight at
runs = 10
check_runs = 40
population = 2.0
skill = "sharp"

# The game's numbers searched by `screen` and `balance`, each a
# `[[knobs]]` table of `name`, `min` and `max`: none. The game's numbers
# are tuned by hand, in `Tuning`'s defaults, and only the minds are
# searched; a balance search cuts each archetype's signature until every
# pairing is even and no style is left
knobs = []

# Held in every scenario, over the game's own numbers
[fixed]

# Balance lessens each pairing's edge and its fights run to the cap, each a
# hundred points off fair, both at `edge` a point, what its median fight
# falls short of `short` seconds, and the mean of how far the minds fall
# short of their styles ([style]); it keeps nothing that widens a
# pairing's win split past `band` points either side of even, or that
# shortfall. A mind
# raises its archetype's edge, each fight run to the cap a loss at full
# health
[score]
band = 15.0
edge = 1.0
short = 24.0

# A mind is held to its archetype's style: the commitment its build invests
# in, used at least `floor`. In points: Ferocity's early combos of its
# skills (at most three in four), Intimidation's bind uptime on its foe (about half
# for a fighter playing to bind), Grace's strikes from a flank of its
# strikes (at most two in three), Preparation's early answers of its
# answers, a reaction's or a Leap clear's (at most all), Patience's stacks
# of Overcommitted its skills strike into, ten points a stack; Awareness's damage answered per clear in
# threats' worth (about two one on one). Each floor is three quarters of
# what the style reaches. Below it
# the mind's score loses `weight` of a hundred points for each share of the
# floor it falls short of. An archetype with no floor is held to nothing.
[style]
weight = 0.25

[style.floor]
berserker = 56.25
juggernaut = 25.0
flanker = 35.0
defender = 1.5
skirmisher = 37.5
ambusher = 50.0

[screen]
# A knob whose sweep across its bounds moves no pairing's edge by this many
# points is left out of the balance search
min_moved = 3.0

# Each archetype's mind: every one tunes `common`, `strike` and `reaction`
# (every bar holds a Feint and a Parry), how much each foe Approach's last
# skill counts (`just_acted`), and its own. A setting not yet in
# `mind::TUNED` starts at `start`, or its range's middle.
[minds]
# Passes over every archetype until no mind gains more than `settle` points
# in one, and no more than `rounds`. A mind is searched against the minds as
# they stand and those of the last `pool` - 1 passes; every `exploit_every`
# passes a fresh search hunts each archetype's best answer to the minds as
# they stand, on winning alone, and reports how far it beats the mind held
settle = 3.0
rounds = 15
pool = 4
exploit_every = 3
just_acted = { min = 0.2, max = 3.0 }
common = [
    { name = "wait", min = 0.05, max = 0.7, start = 0.35 },
    { name = "hold", min = 0.05, max = 0.6, start = 0.35 },
    { name = "momentum", min = 0.0, max = 0.3, start = 0.15 },
    { name = "combo", min = 0.0, max = 0.3, start = 0.15 },
    { name = "recovery_left.to", min = 1.0, max = 12.0, start = 10.0 },
    { name = "recovery_left.floor", min = 0.0, max = 1.0, start = 1.0 },
    { name = "leash_left.to", min = 0.05, max = 0.6, start = 0.3 },
    { name = "effect_added.from", min = 0.0, max = 0.9, start = 0.0 },
    { name = "detour.to", min = 0.1, max = 2.0, start = 1.0 },
    { name = "exposure.to", min = 0.2, max = 1.0, start = 0.9 },
    { name = "exposure.floor", min = 0.0, max = 1.0, start = 1.0 },
    { name = "behind.to", min = 0.2, max = 1.0, start = 0.5 },
    { name = "behind.floor", min = 0.0, max = 1.0, start = 1.0 },
]
strike = [
    { name = "foe_just_acted.floor", min = 0.2, max = 1.0, start = 0.6 },
    { name = "foe_just_acted.from", min = 0.5, max = 4.0, start = 2.0 },
]
reaction = [
    { name = "worth_answering.to", min = 0.05, max = 0.8, start = 0.3 },
]

[minds.own]
berserker = [
]
juggernaut = [
]
flanker = [
]
defender = [
]
skirmisher = [
]
ambusher = [
]

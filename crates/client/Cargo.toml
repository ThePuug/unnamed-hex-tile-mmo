[package]
name = "client"
version = "0.1.0"
edition = "2021"

[features]
default = ["admin", "dynamic"]
admin = ["dep:world"]
# Bevy links as a dylib for fast iteration builds. Incompatible with the
# release profile's LTO, which needs bitcode the dylib does not carry — drop it
# with `--no-default-features` for an optimized build.
dynamic = ["bevy/dynamic_linking", "common-bevy/dynamic"]
trace = ["bevy/trace", "bevy/trace_tracy", "bevy/debug"]

[dependencies]
common = { path = "../common" }
common-bevy = { path = "../common-bevy" }
bevy = { version = "0.19", features = ["dds"] }
bevy_asset = "0.19"
bevy_camera = "0.19"
bevy_easings = "0.19"
bevy_light = "0.19"
bevy_mesh = "0.19"
bytemuck = { version = "1", features = ["derive"] }
renet_netcode = "2"
bimap = "0"
dashmap = "6"
bincode = { version = "2", default-features = false, features = ["std", "serde"] }
chrono = "0"
renet = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bevy_egui = "0.42"

[dependencies.qrz]
path = "../qrz"

[dependencies.world]
path = "../world"
optional = true

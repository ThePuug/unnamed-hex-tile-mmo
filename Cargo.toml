[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/common-bevy",
    "crates/client",
    "crates/server",
    "crates/qrz",
    "crates/console",
    "crates/world",
    "crates/world-viewer",
]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
incremental = false
debug = false

# Bevy's shadow pass opens no diagnostic span, so what the shadow maps
# cost is the one pass in the frame nothing measures. The fork adds the
# `pass_span` every other pass already has, and adds together spans that
# share a name within a frame, so a pass run once per view (the shadow
# pass per cascade) reports what it cost the frame rather than a blend of
# its views. Cut from the 0.19.1 tag the rest of Bevy resolves to.
#
# Every crate of that workspace is patched, not just bevy_pbr: patching
# one leaves its siblings resolving to the registry as well as to the
# fork, and two copies of bevy_ecs are two sets of types that do not
# meet.
[patch.crates-io]
bevy = { git = "https://github.com/ThePuug/bevy", branch = "shadow-pass-diagnostic" }
bevy_a11y = { git = "https://github.com/ThePuug/bevy", branch = "shadow-pass-diagnostic" }

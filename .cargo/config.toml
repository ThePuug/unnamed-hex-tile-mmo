[env]
# sqlx's query macros read `.sqlx/` and never connect, whatever DATABASE_URL
# says, so a build needs no database running. `cargo sqlx prepare` sets its
# own SQLX_OFFLINE, which this does not override.
SQLX_OFFLINE = "true"

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"   # Use LLD Linker
rustflags = [
  "-Zshare-generics=off", # (Nightly)
  "-Zthreads=0",          # (Nightly) Use improved multithreading with the recommended amount of threads.
]

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
  "-Zshare-generics=y", # (Nightly)
  "-Zthreads=0",        # (Nightly) Use improved multithreading with the recommended amount of threads.
  "-C", "link-arg=-fuse-ld=/usr/bin/mold",
]